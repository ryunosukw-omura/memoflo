<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wedding Photo Upload</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:

                radial-gradient(
                    circle at 10% 15%,
                    rgba(255, 130, 185, 0.55),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 15%,
                    rgba(255, 230, 100, 0.60),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 15% 90%,
                    rgba(190, 255, 120, 0.55),
                    transparent 32%
                ),

                linear-gradient(
                    135deg,
                    #fff8fb,
                    #fffce7,
                    #f4ffe7
                );

            color: #8f3658;
        }


        .page {
            width: 100%;
            max-width: 650px;

            margin: 0 auto;

            padding:
                30px
                18px
                50px;
        }


        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .small-title {
            font-size: 12px;
            letter-spacing: 3px;
            font-weight: bold;
            color: #d84b78;
            margin-bottom: 8px;
        }

        h1 {
            margin:
                0
                0
                8px;

            font-family:
                Georgia,
                serif;

            font-size:
                clamp(
                    28px,
                    8vw,
                    42px
                );

            font-weight: normal;

            color: #b83263;
        }

        .subtitle {
            margin: 0;

            font-size: 14px;
            line-height: 1.7;

            color: #7b5260;
        }


        .card {
            background:
                rgba(
                    255,
                    255,
                    255,
                    0.88
                );

            border-radius: 22px;

            padding: 22px;

            box-shadow:
                0 16px 40px
                rgba(
                    180,
                    80,
                    120,
                    0.15
                );

            backdrop-filter:
                blur(8px);
        }


        .select-label {
            display: flex;

            justify-content: center;
            align-items: center;

            width: 100%;
            min-height: 64px;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #ff76ad,
                    #ff9b74
                );

            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 18px
                rgba(
                    225,
                    80,
                    130,
                    0.24
                );
        }

        #photoInput {
            display: none;
        }


        .notice {
            margin:
                14px
                0
                0;

            text-align: center;

            font-size: 12px;
            line-height: 1.6;

            color: #8c777d;
        }


        #selectedInfo {
            margin-top: 18px;

            text-align: center;

            font-weight: bold;

            color: #b83263;
        }


        #previewArea {
            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    1fr
                );

            gap: 10px;

            margin-top: 18px;
        }

        .preview-item {
            overflow: hidden;

            aspect-ratio:
                1 / 1;

            background: white;

            border-radius: 12px;

            box-shadow:
                0 4px 12px
                rgba(
                    100,
                    60,
                    80,
                    0.13
                );
        }

        .preview-item img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        #uploadButton {
            width: 100%;
            min-height: 62px;

            border: none;
            border-radius: 16px;

            margin-top: 22px;

            font-size: 18px;
            font-weight: bold;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #8ccf45,
                    #c0dc41
                );

            box-shadow:
                0 8px 18px
                rgba(
                    110,
                    170,
                    50,
                    0.25
                );

            cursor: pointer;
        }

        #uploadButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }


        #statusBox {
            display: none;

            margin-top: 20px;

            padding: 16px;

            border-radius: 14px;

            text-align: center;

            line-height: 1.7;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.85
                );

            color: #7b5260;
        }

        #statusBox.success {
            display: block;

            background: #efffdc;

            color: #51751d;
        }

        #statusBox.error {
            display: block;

            background: #ffe5ec;

            color: #b12e58;
        }

        #statusBox.loading {
            display: block;
        }


        .spinner {
            width: 28px;
            height: 28px;

            margin:
                0 auto
                12px;

            border:
                4px solid
                rgba(
                    216,
                    75,
                    120,
                    0.18
                );

            border-top-color: #d84b78;

            border-radius: 50%;

            animation:
                spin
                0.8s
                linear
                infinite;
        }

        @keyframes spin {
            to {
                transform:
                    rotate(360deg);
            }
        }


        .footer {
            text-align: center;

            margin-top: 25px;

            font-family:
                Georgia,
                serif;

            color: #c34b72;
        }


        @media (max-width: 420px) {

            .page {
                padding:
                    22px
                    14px
                    40px;
            }

            .card {
                padding: 18px;
            }

            .select-label,
            #uploadButton {
                font-size: 17px;
            }
        }

    </style>
</head>


<body>

<div class="page">


    <div class="header">

        <div class="small-title">
            SHARE YOUR MEMORIES
        </div>

        <h1>
            RYUNOSUKE & MAKOTO
        </h1>

        <p class="subtitle">
            今日の素敵な思い出を<br>
            ぜひ写真でシェアしてください ♡
        </p>

    </div>


    <div class="card">


        <label
            for="photoInput"
            class="select-label"
        >
            📷 写真を選ぶ
        </label>


        <input
            type="file"
            id="photoInput"
            accept="image/*"
            multiple
        >


        <p class="notice">
            一度に最大10枚まで送れます。<br>
            写真は送信時に自動で軽くします。
        </p>


        <div id="selectedInfo">
            写真を選択してください
        </div>


        <div id="previewArea"></div>


        <button
            id="uploadButton"
            disabled
        >
            写真を送る ♡
        </button>


        <div id="statusBox"></div>


    </div>


    <div class="footer">
        ♡ Thank you for sharing! ♡
    </div>


</div>


<script>


// ========================================
// Supabase設定
// ========================================

const SUPABASE_URL =
    "https://tnqnowlvtnrzrcydcsmi.supabase.co";


// ↓↓↓
// 今まで使っているPublishable keyを入れてください
const SUPABASE_ANON_KEY =
    "sb_publishable_Mp7PsY2wh5VZtEDYC9fHrg_wvFDa8rO";


// ========================================
// 設定
// ========================================

const MAX_FILES = 10;

const MAX_FILE_SIZE =
    10 * 1024 * 1024;

const MAX_IMAGE_WIDTH =
    1800;

const IMAGE_QUALITY =
    0.82;


// ========================================
// HTML取得
// ========================================

const photoInput =
    document.getElementById(
        "photoInput"
    );

const previewArea =
    document.getElementById(
        "previewArea"
    );

const uploadButton =
    document.getElementById(
        "uploadButton"
    );

const selectedInfo =
    document.getElementById(
        "selectedInfo"
    );

const statusBox =
    document.getElementById(
        "statusBox"
    );


let selectedFiles = [];


// ========================================
// 写真選択
// ========================================

photoInput.addEventListener(
    "change",
    function () {

        const files =
            Array.from(
                photoInput.files
            );


        if (
            files.length >
            MAX_FILES
        ) {

            alert(
                "一度に送れる写真は最大10枚です。"
            );

            photoInput.value =
                "";

            selectedFiles =
                [];

            updatePreview();

            return;
        }


        const tooLarge =
            files.find(
                function (file) {

                    return (
                        file.size >
                        MAX_FILE_SIZE
                    );
                }
            );


        if (tooLarge) {

            alert(
                "10MBを超えている写真があります。"
            );

            photoInput.value =
                "";

            selectedFiles =
                [];

            updatePreview();

            return;
        }


        selectedFiles =
            files;


        updatePreview();
    }
);


// ========================================
// プレビュー
// ========================================

function updatePreview() {

    previewArea.innerHTML =
        "";


    if (
        selectedFiles.length === 0
    ) {

        selectedInfo.textContent =
            "写真を選択してください";

        uploadButton.disabled =
            true;

        return;
    }


    selectedInfo.textContent =
        selectedFiles.length +
        "枚選択中";


    uploadButton.disabled =
        false;


    selectedFiles.forEach(
        function (file) {

            const wrapper =
                document.createElement(
                    "div"
                );

            wrapper.className =
                "preview-item";


            const img =
                document.createElement(
                    "img"
                );


            const objectURL =
                URL.createObjectURL(
                    file
                );


            img.src =
                objectURL;


            img.onload =
                function () {

                    URL.revokeObjectURL(
                        objectURL
                    );
                };


            wrapper.appendChild(
                img
            );

            previewArea.appendChild(
                wrapper
            );
        }
    );
}


// ========================================
// 画像圧縮
// ========================================

async function compressImage(file) {

    return new Promise(
        function (
            resolve,
            reject
        ) {

            const img =
                new Image();


            const objectURL =
                URL.createObjectURL(
                    file
                );


            img.onload =
                function () {

                    URL.revokeObjectURL(
                        objectURL
                    );


                    let width =
                        img.width;

                    let height =
                        img.height;


                    if (
                        width >
                        MAX_IMAGE_WIDTH
                    ) {

                        const ratio =
                            MAX_IMAGE_WIDTH /
                            width;

                        width =
                            MAX_IMAGE_WIDTH;

                        height =
                            Math.round(
                                height *
                                ratio
                            );
                    }


                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    canvas.width =
                        width;

                    canvas.height =
                        height;


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    canvas.toBlob(
                        function (blob) {

                            if (!blob) {

                                reject(
                                    new Error(
                                        "画像変換に失敗しました"
                                    )
                                );

                                return;
                            }


                            resolve(blob);

                        },

                        "image/jpeg",

                        IMAGE_QUALITY
                    );
                };


            img.onerror =
                function () {

                    URL.revokeObjectURL(
                        objectURL
                    );

                    reject(
                        new Error(
                            "画像を読み込めませんでした"
                        )
                    );
                };


            img.src =
                objectURL;
        }
    );
}


// ========================================
// ファイル名
// ========================================

function createFileName() {

    const random =
        Math.random()
            .toString(36)
            .substring(2, 10);


    return (
        Date.now() +
        "_" +
        random +
        ".jpg"
    );
}


// ========================================
// Storageへアップロード
// ========================================

async function uploadToStorage(
    blob,
    fileName
) {

    const response =
        await fetch(
            SUPABASE_URL +
            "/storage/v1/object/photos/" +
            fileName,
            {

                method:
                    "POST",

                headers: {

                    "apikey":
                        SUPABASE_ANON_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_ANON_KEY,

                    "Content-Type":
                        "image/jpeg",

                    "x-upsert":
                        "false"
                },

                body:
                    blob
            }
        );


    if (!response.ok) {

        const errorText =
            await response.text();

        throw new Error(
            "Storage upload error: " +
            errorText
        );
    }


    return (
        SUPABASE_URL +
        "/storage/v1/object/public/photos/" +
        fileName
    );
}


// ========================================
// photosテーブル登録
// ========================================

async function insertPhotoRow(
    imageURL
) {

    const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/photos",
            {

                method:
                    "POST",

                headers: {

                    "apikey":
                        SUPABASE_ANON_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_ANON_KEY,

                    "Content-Type":
                        "application/json",

                    "Prefer":
                        "return=minimal"
                },

                body:
                    JSON.stringify(
                        {
                            image_url:
                                imageURL
                        }
                    )
            }
        );


    if (!response.ok) {

        const errorText =
            await response.text();

        throw new Error(
            "Database insert error: " +
            errorText
        );
    }
}


// ========================================
// 送信
// ========================================

uploadButton.addEventListener(
    "click",
    async function () {

        if (
            selectedFiles.length === 0
        ) {
            return;
        }


        uploadButton.disabled =
            true;

        photoInput.disabled =
            true;


        let successCount = 0;

        let failCount = 0;


        statusBox.className =
            "loading";

        statusBox.innerHTML =
            `
            <div class="spinner"></div>
            <div id="progressText">
                送信準備中...
            </div>
            `;


        const progressText =
            document.getElementById(
                "progressText"
            );


        for (
            let i = 0;
            i < selectedFiles.length;
            i++
        ) {

            const file =
                selectedFiles[i];


            try {

                progressText.textContent =
                    (
                        i + 1
                    ) +
                    " / " +
                    selectedFiles.length +
                    " 枚目を送信中...";


                const compressedBlob =
                    await compressImage(
                        file
                    );


                const fileName =
                    createFileName();


                const publicURL =
                    await uploadToStorage(
                        compressedBlob,
                        fileName
                    );


                await insertPhotoRow(
                    publicURL
                );


                successCount++;


            } catch (error) {

                console.error(error);

                failCount++;
            }
        }


        if (
            failCount === 0
        ) {

            statusBox.className =
                "success";

            statusBox.innerHTML =
                `
                <strong>
                    Thank you! ♡
                </strong>
                <br>
                ${successCount}枚の写真を送信しました。
                <br>
                会場スクリーンに表示されます！
                `;


            selectedFiles =
                [];

            photoInput.value =
                "";

            updatePreview();


        } else {

            statusBox.className =
                "error";

            statusBox.innerHTML =
                `
                送信完了：${successCount}枚
                <br>
                送信失敗：${failCount}枚
                <br><br>
                失敗した場合はもう一度お試しください。
                `;
        }


        photoInput.disabled =
            false;


        if (
            selectedFiles.length >
            0
        ) {

            uploadButton.disabled =
                false;
        }
    }
);

</script>


</body>

</html>

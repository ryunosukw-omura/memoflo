<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Wedding Photo Upload
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;

            font-family:
                Arial,
                "Hiragino Kaku Gothic ProN",
                "Yu Gothic",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff6f8,
                    #fff9dd,
                    #f1ffe9
                );

            color:
                #5a4a4f;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 28px 18px 50px;
        }

        .card {
            background:
                rgba(
                    255,
                    255,
                    255,
                    0.96
                );

            border-radius: 24px;

            padding: 26px 20px;

            box-shadow:
                0 12px 35px
                rgba(
                    120,
                    80,
                    90,
                    0.14
                );
        }

        h1 {
            margin: 0 0 8px;

            text-align: center;

            font-size: 28px;

            color:
                #d86f91;
        }

        .names {
            text-align: center;

            font-weight: bold;

            font-size: 16px;

            margin-bottom: 8px;

            color:
                #7a6b6f;
        }

        .date {
            text-align: center;

            font-size: 14px;

            margin-bottom: 24px;

            color:
                #a28f94;
        }

        .description {
            text-align: center;

            line-height: 1.8;

            margin-bottom: 24px;

            font-size: 15px;
        }

        .section-title {
            font-size: 15px;

            font-weight: bold;

            margin:
                18px 0 8px;
        }

        .nickname-area {
            background:
                #fff8fb;

            border:
                2px solid
                #f6cad7;

            padding: 14px;

            border-radius: 16px;

            margin-bottom: 18px;
        }

        #nicknameInput {
            width: 100%;

            padding: 13px 14px;

            border:
                2px solid
                #f2c4d1;

            border-radius: 12px;

            outline: none;

            font-size: 16px;

            background:
                white;
        }

        #nicknameInput:focus {
            border-color:
                #e88eaa;
        }

        .nickname-note {
            margin-top: 8px;

            font-size: 12px;

            color:
                #a1858e;

            line-height: 1.5;
        }

        .file-box {
            display: block;

            width: 100%;

            padding: 20px 14px;

            text-align: center;

            border:
                2px dashed
                #f0b9ca;

            border-radius: 18px;

            background:
                #fff9fb;

            cursor: pointer;
        }

        .file-box strong {
            display: block;

            color:
                #d96f91;

            font-size: 17px;

            margin-bottom: 5px;
        }

        .file-box span {
            font-size: 13px;

            color:
                #907c82;
        }

        #photoInput {
            display: none;
        }

        #previewArea {
            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 8px;

            margin-top: 16px;
        }

        .preview-item {
            position: relative;

            width: 100%;

            aspect-ratio:
                1 / 1;

            overflow: hidden;

            border-radius: 10px;

            background:
                #eee;
        }

        .preview-item img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        #fileCount {
            text-align: center;

            margin-top: 10px;

            font-size: 13px;

            color:
                #89757b;
        }

        #uploadButton {
            width: 100%;

            margin-top: 22px;

            padding: 16px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #ef8bab,
                    #e66f96
                );

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 18px
                rgba(
                    220,
                    100,
                    140,
                    0.25
                );
        }

        #uploadButton:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        #status {
            min-height: 24px;

            margin-top: 18px;

            text-align: center;

            font-weight: bold;

            line-height: 1.6;
        }

        .status-success {
            color:
                #4c9b63;
        }

        .status-error {
            color:
                #d65b64;
        }

        .status-working {
            color:
                #c17c33;
        }

        .spinner {
            display: none;

            width: 34px;
            height: 34px;

            margin:
                18px auto 0;

            border:
                4px solid
                #f4d3dc;

            border-top-color:
                #df7699;

            border-radius:
                50%;

            animation:
                spin
                0.8s
                linear
                infinite;
        }

        @keyframes spin {
            to {
                transform:
                    rotate(360deg);
            }
        }

        .footer {
            text-align: center;

            margin-top: 22px;

            font-size: 12px;

            color:
                #aa969c;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            Wedding Photo
        </h1>

        <div class="names">
            RYUNOSUKE & MAKOTO
        </div>

        <div class="date">
            2027.02.22
        </div>

        <div class="description">
            今日の思い出を<br>
            ぜひ写真でシェアしてください ♡
        </div>


        <div class="nickname-area">

            <div class="section-title">
                ニックネーム
            </div>

            <input
                type="text"
                id="nicknameInput"
                maxlength="20"
                placeholder="例：りゅうちゃん"
            >

            <div class="nickname-note">
                この名前はフォトコンテストで使用します。<br>
                一度入力すると、この端末に保存されます。
            </div>

        </div>


        <div class="section-title">
            写真を選ぶ
        </div>

        <label
            class="file-box"
            for="photoInput"
        >

            <strong>
                ＋ 写真を選択
            </strong>

            <span>
                一度に最大10枚まで
            </span>

        </label>

        <input
            type="file"
            id="photoInput"
            accept="image/*"
            multiple
        >


        <div id="previewArea"></div>

        <div id="fileCount"></div>


        <button
            id="uploadButton"
            type="button"
        >
            写真を送る
        </button>


        <div
            id="spinner"
            class="spinner"
        ></div>

        <div id="status"></div>


        <div class="footer">
            Thank you for sharing our special day ♡
        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://tnqnowlvtnrzrcydcsmi.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_Mp7PsY2wh5VZtEDYC9fHrg_wvFDa8rO";


const MAX_FILES = 10;

const MAX_FILE_SIZE =
    10 * 1024 * 1024;

const MAX_IMAGE_WIDTH =
    1800;

const IMAGE_QUALITY =
    0.82;


const nicknameInput =
    document.getElementById(
        "nicknameInput"
    );

const photoInput =
    document.getElementById(
        "photoInput"
    );

const previewArea =
    document.getElementById(
        "previewArea"
    );

const fileCount =
    document.getElementById(
        "fileCount"
    );

const uploadButton =
    document.getElementById(
        "uploadButton"
    );

const spinner =
    document.getElementById(
        "spinner"
    );

const status =
    document.getElementById(
        "status"
    );


let selectedFiles = [];


/* =========================
   ニックネーム保存
========================= */

const savedNickname =
    localStorage.getItem(
        "weddingNickname"
    );

if (savedNickname) {

    nicknameInput.value =
        savedNickname;

}


nicknameInput.addEventListener(
    "input",
    () => {

        const nickname =
            nicknameInput.value.trim();

        if (nickname) {

            localStorage.setItem(
                "weddingNickname",
                nickname
            );

        }

    }
);


/* =========================
   写真選択
========================= */

photoInput.addEventListener(
    "change",
    () => {

        selectedFiles =
            Array.from(
                photoInput.files
            );

        if (
            selectedFiles.length
            > MAX_FILES
        ) {

            alert(
                "一度に送れる写真は最大10枚です。"
            );

            selectedFiles =
                selectedFiles.slice(
                    0,
                    MAX_FILES
                );

        }

        previewArea.innerHTML =
            "";

        selectedFiles.forEach(
            file => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "preview-item";

                const img =
                    document.createElement(
                        "img"
                    );

                img.src =
                    URL.createObjectURL(
                        file
                    );

                item.appendChild(
                    img
                );

                previewArea.appendChild(
                    item
                );

            }
        );


        if (
            selectedFiles.length > 0
        ) {

            fileCount.textContent =
                selectedFiles.length
                + "枚選択中";

        } else {

            fileCount.textContent =
                "";

        }

    }
);


/* =========================
   画像圧縮
========================= */

function compressImage(file) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const img =
                new Image();

            const reader =
                new FileReader();


            reader.onload =
                event => {

                    img.onload =
                        () => {

                            let width =
                                img.width;

                            let height =
                                img.height;


                            if (
                                width
                                > MAX_IMAGE_WIDTH
                            ) {

                                height =
                                    Math.round(
                                        height
                                        *
                                        MAX_IMAGE_WIDTH
                                        /
                                        width
                                    );

                                width =
                                    MAX_IMAGE_WIDTH;

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );

                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            canvas.toBlob(
                                blob => {

                                    if (!blob) {

                                        reject(
                                            new Error(
                                                "画像の圧縮に失敗しました。"
                                            )
                                        );

                                        return;

                                    }

                                    resolve(
                                        blob
                                    );

                                },
                                "image/jpeg",
                                IMAGE_QUALITY
                            );

                        };


                    img.onerror =
                        reject;


                    img.src =
                        event.target.result;

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================
   1枚アップロード
========================= */

async function uploadOnePhoto(
    file,
    nickname
) {

    if (
        file.size
        > MAX_FILE_SIZE
    ) {

        throw new Error(
            file.name
            +
            " は10MBを超えています。"
        );

    }


    const compressedBlob =
        await compressImage(
            file
        );


    const fileName =
        Date.now()
        + "_"
        + Math.random()
            .toString(36)
            .slice(2)
        + ".jpg";


    const storageResponse =
        await fetch(
            SUPABASE_URL
            +
            "/storage/v1/object/photos/"
            +
            fileName,
            {

                method:
                    "POST",

                headers: {

                    "apikey":
                        SUPABASE_ANON_KEY,

                    "Authorization":
                        "Bearer "
                        +
                        SUPABASE_ANON_KEY,

                    "Content-Type":
                        "image/jpeg",

                    "x-upsert":
                        "false"

                },

                body:
                    compressedBlob

            }
        );


    if (
        !storageResponse.ok
    ) {

        const errorText =
            await storageResponse.text();

        throw new Error(
            "画像保存エラー："
            +
            errorText
        );

    }


    const publicURL =
        SUPABASE_URL
        +
        "/storage/v1/object/public/photos/"
        +
        fileName;


    const databaseResponse =
        await fetch(
            SUPABASE_URL
            +
            "/rest/v1/photos",
            {

                method:
                    "POST",

                headers: {

                    "apikey":
                        SUPABASE_ANON_KEY,

                    "Authorization":
                        "Bearer "
                        +
                        SUPABASE_ANON_KEY,

                    "Content-Type":
                        "application/json",

                    "Prefer":
                        "return=minimal"

                },

                body:
                    JSON.stringify(
                        {

                            image_url:
                                publicURL,

                            nickname:
                                nickname

                        }
                    )

            }
        );


    if (
        !databaseResponse.ok
    ) {

        const errorText =
            await databaseResponse.text();

        throw new Error(
            "データ保存エラー："
            +
            errorText
        );

    }

}


/* =========================
   送信ボタン
========================= */

uploadButton.addEventListener(
    "click",
    async () => {

        status.textContent =
            "";

        status.className =
            "";


        const nickname =
            nicknameInput.value.trim();


        if (!nickname) {

            alert(
                "ニックネームを入力してください。"
            );

            nicknameInput.focus();

            return;

        }


        if (
            selectedFiles.length
            === 0
        ) {

            alert(
                "写真を選択してください。"
            );

            return;

        }


        localStorage.setItem(
            "weddingNickname",
            nickname
        );


        uploadButton.disabled =
            true;

        spinner.style.display =
            "block";

        status.className =
            "status-working";

        status.textContent =
            "送信しています…";


        let successCount = 0;

        let failureCount = 0;


        for (
            let i = 0;
            i < selectedFiles.length;
            i++
        ) {

            try {

                status.textContent =
                    (
                        i + 1
                    )
                    +
                    " / "
                    +
                    selectedFiles.length
                    +
                    " 枚目を送信中…";


                await uploadOnePhoto(
                    selectedFiles[i],
                    nickname
                );


                successCount++;

            } catch (error) {

                console.error(
                    error
                );

                failureCount++;

            }

        }


        spinner.style.display =
            "none";

        uploadButton.disabled =
            false;


        if (
            failureCount === 0
        ) {

            status.className =
                "status-success";

            status.innerHTML =
                "送信できました ♡<br>"
                +
                successCount
                +
                "枚の写真をありがとうございます！";


            selectedFiles =
                [];

            photoInput.value =
                "";

            previewArea.innerHTML =
                "";

            fileCount.textContent =
                "";

        } else {

            status.className =
                "status-error";

            status.innerHTML =
                successCount
                +
                "枚送信成功<br>"
                +
                failureCount
                +
                "枚送信できませんでした。";

        }

    }
);

</script>

</body>
</html>

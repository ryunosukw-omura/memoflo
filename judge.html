<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo Contest & Photo Manager</title>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #fff7fa, #fff9e9, #f4fff0);
    color: #57494e;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 16px 80px;
}

h1 {
    text-align: center;
    margin: 0;
    color: #d86f91;
    font-size: 30px;
}

.subtitle {
    text-align: center;
    margin: 8px 0 24px;
    color: #8f7e84;
}

.login-box {
    max-width: 420px;
    margin: 40px auto;
    padding: 24px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(120,80,90,.14);
}

.login-box h2 {
    text-align: center;
    margin-top: 0;
}

input,
select,
button {
    width: 100%;
    font-size: 16px;
}

input,
select {
    padding: 13px;
    border-radius: 12px;
    border: 2px solid #ecc5d2;
    background: white;
}

button {
    margin-top: 12px;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: #e8789b;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

#judgeArea {
    display: none;
}

.toolbar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
}

.toolbar-box,
.manager-box,
.finale-box {
    background: white;
    padding: 14px;
    border-radius: 16px;
    margin-bottom: 16px;
    box-shadow: 0 7px 22px rgba(120,80,90,.10);
}

.toolbar-label,
.manager-title,
.finale-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 10px;
}

.finale-title {
    text-align: center;
    font-size: 17px;
}

.finale-description {
    text-align: center;
    color: #8f7e84;
    font-size: 13px;
    margin-bottom: 12px;
}

.finale-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.finale-buttons button {
    margin: 0;
    font-size: 17px;
    padding: 16px 10px;
}

#startFinaleButton {
    background: linear-gradient(135deg, #d5a52e, #c78c16);
}

#stopFinaleButton {
    background: #667b95;
}

.selection-count {
    margin-bottom: 10px;
    color: #846f76;
    font-size: 14px;
}

.manager-buttons {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 8px;
}

.manager-buttons button {
    margin: 0;
}

.select-all-button {
    background: #6c92c8;
}

.unselect-button {
    background: #929292;
}

.download-button,
.single-download-button {
    background: #4cae72;
}

.delete-selected-button,
.single-delete-button {
    background: #d8525c;
}

#status {
    text-align: center;
    margin-bottom: 16px;
    min-height: 24px;
    font-weight: bold;
}

.success {
    color: #4d9860;
}

.error {
    color: #cf5961;
}

.loading {
    color: #bf813e;
}

.photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(220px,1fr));
    gap: 16px;
}

.photo-card {
    position: relative;
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 22px rgba(100,70,80,.12);
    border: 3px solid transparent;
}

.photo-card.award-selected {
    border-color: #ef8cab;
}

.photo-card.download-selected {
    outline: 4px solid #4cae72;
    outline-offset: -4px;
}

.photo-checkbox {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 20;
    width: 34px;
    height: 34px;
    accent-color: #42a567;
    cursor: pointer;
}

.image-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1/1;
    background: #f3eeee;
    overflow: hidden;
}

.image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.image-error {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #f6f1f2;
    color: #9a7d86;
}

.photo-info {
    padding: 12px;
}

.nickname {
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 8px;
}

.award-badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    background: #fff1b8;
    color: #8d6b10;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 8px;
}

.select-button {
    background: linear-gradient(135deg,#ef8cab,#e17095);
}

.announce-button {
    background: linear-gradient(135deg,#f0b83f,#e8962f);
}

.clear-button {
    background: #9a8f93;
}

@media(max-width:650px) {
    .toolbar,
    .finale-buttons {
        grid-template-columns: 1fr;
    }

    .manager-buttons {
        grid-template-columns: 1fr 1fr;
    }

    .photo-grid {
        grid-template-columns: repeat(2,1fr);
        gap: 9px;
    }

    button {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Photo Contest</h1>

<div class="subtitle">
RYUNOSUKE & MAKOTO<br>
Photo Manager
</div>

<div id="loginBox" class="login-box">

<h2>選考・写真管理ページ</h2>

<input
    type="password"
    id="judgeCode"
    placeholder="暗証番号を入力"
>

<button id="loginButton" type="button">
管理画面を開く
</button>

</div>


<div id="judgeArea">

<div class="toolbar">

<div class="toolbar-box">

<div class="toolbar-label">
選ぶ賞
</div>

<select id="awardSelect">
<option value="BEST PHOTO">BEST PHOTO</option>
<option value="ベストスマイル賞">ベストスマイル賞</option>
<option value="おもしろフォト賞">おもしろフォト賞</option>
<option value="新郎新婦賞">新郎新婦賞</option>
</select>

</div>


<div class="toolbar-box">

<div class="toolbar-label">
写真一覧
</div>

<button
    id="reloadButton"
    type="button"
    style="margin-top:0;"
>
🔄 写真を更新
</button>

</div>

</div>


<!-- フィナーレ操作 -->
<div class="finale-box">

<div class="finale-title">
Wedding Finale
</div>

<div class="finale-description">
会場スクリーンのフィナーレを操作します
</div>

<div class="finale-buttons">

<button
    id="startFinaleButton"
    type="button"
>
✨ フィナーレ開始
</button>

<button
    id="stopFinaleButton"
    type="button"
>
↩ 通常画面に戻す
</button>

</div>

</div>


<div class="manager-box">

<div class="manager-title">
写真のダウンロード・削除
</div>

<div
    id="selectionCount"
    class="selection-count"
>
0枚選択中
</div>

<div class="manager-buttons">

<button
    id="selectAllButton"
    class="select-all-button"
    type="button"
>
全選択
</button>

<button
    id="unselectAllButton"
    class="unselect-button"
    type="button"

選択解除
</button>

<button
    id="downloadSelectedButton"
    class="download-button"
    type="button"
>
📥 選択写真をDL
</button>

<button
    id="shareSelectedButton"

>
↗ 選択写真をシェア

<button

    class="delete-selected-button"

>
🗑 選択写真を削除

</div>

</div>

<div id="status"></div>

<div
    id="photoGrid"
    class="photo-grid"
></div>

</div>

</div>


<script>

const SUPABASE_URL =
    "https://tnqnowlvtnrzrcydcsmi.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_Mp7PsY2wh5VZtEDYC9fHrg_wvFDa8rO";

const JUDGE_CODE =
    "0222";

const STORAGE_BUCKET =
    "photos";


const loginBox =
    document.getElementById("loginBox");

const judgeArea =
    document.getElementById("judgeArea");

const judgeCode =
    document.getElementById("judgeCode");

const loginButton =
    document.getElementById("loginButton");

const awardSelect =
    document.getElementById("awardSelect");

const reloadButton =
    document.getElementById("reloadButton");

const photoGrid =
    document.getElementById("photoGrid");

const status =
    document.getElementById("status");

const selectionCount =
    document.getElementById("selectionCount");

const selectAllButton =
    document.getElementById("selectAllButton");

const unselectAllButton =
    document.getElementById("unselectAllButton");

const downloadSelectedButton =
    document.getElementById("downloadSelectedButton");

const shareSelectedButton =
    document.getElementById("shareSelectedButton");

const deleteSelectedButton =
    document.getElementById("deleteSelectedButton");

const startFinaleButton =
    document.getElementById("startFinaleButton");

const stopFinaleButton =
    document.getElementById("stopFinaleButton");


let currentPhotos = [];

const selectedPhotoIds =
    new Set();


/* ========================================
   ログイン
======================================== */

loginButton.addEventListener(
    "click",
    () => {

        if (
            judgeCode.value
            !==
            JUDGE_CODE
        ) {

            alert(
                "暗証番号が違います。"
            );

            return;
        }

        loginBox.style.display =
            "none";

        judgeArea.style.display =
            "block";

        loadPhotos();
    }
);


/* ========================================
   フィナーレ命令
======================================== */

async function sendFinaleCommand(
    command
) {

    const isStart =
        command === "start";


    if (isStart) {

        const confirmed =
            confirm(
                "会場スクリーンでフィナーレを開始しますか？"
            );

        if (!confirmed) {
            return;
        }

    } else {

        const confirmed =
            confirm(
                "フィナーレを終了して通常画面に戻しますか？"
            );

        if (!confirmed) {
            return;
        }
    }


    startFinaleButton.disabled =
        true;

    stopFinaleButton.disabled =
        true;


    status.className =
        "loading";

    status.textContent =
        isStart
        ?
        "✨ フィナーレ開始を送信しています…"
        :
        "通常画面へ戻しています…";


    try {

        const response =
            await fetch(

                SUPABASE_URL
                +
                "/rest/v1/rpc/set_wedding_finale",

                {

                    method:
                        "POST",

                    headers: {

                        "apikey":
                            SUPABASE_ANON_KEY,

                        "Authorization":
                            "Bearer "
                            +
                            SUPABASE_ANON_KEY,

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            {
                                p_command:
                                    command,

                                p_code:
                                    JUDGE_CODE
                            }
                        )
                }
            );


        if (!response.ok) {

            const message =
                await response.text();

            throw new Error(
                message
            );
        }


        status.className =
            "success";

        status.textContent =
            isStart
            ?
            "✨ フィナーレ開始を会場へ送信しました！"
            :
            "↩ 通常画面へ戻す命令を送信しました！";

    }
    catch (error) {

        console.error(
            "Finale command error:",
            error
        );

        status.className =
            "error";

        status.textContent =
            "フィナーレ操作を送信できませんでした。";
    }
    finally {

        startFinaleButton.disabled =
            false;

        stopFinaleButton.disabled =
            false;
    }
}


startFinaleButton.addEventListener(
    "click",
    () => {
        sendFinaleCommand(
            "start"
        );
    }
);


stopFinaleButton.addEventListener(
    "click",
    () => {
        sendFinaleCommand(
            "stop"
        );
    }
);


/* ========================================
   写真取得
======================================== */

async function loadPhotos() {

    status.className =
        "loading";

    status.textContent =
        "写真を読み込んでいます…";

    try {

        const response =
            await fetch(

                SUPABASE_URL
                +
                "/rest/v1/photos"
                +
                "?select=id,image_url,nickname,award,created_at,announced_at"
                +
                "&order=created_at.desc",

                {
                    headers: {

                        "apikey":
                            SUPABASE_ANON_KEY,

                        "Authorization":
                            "Bearer "
                            +
                            SUPABASE_ANON_KEY
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                await response.text()
            );
        }


        currentPhotos =
            await response.json();


        const validIds =
            new Set(
                currentPhotos.map(
                    photo =>
                        photo.id
                )
            );


        [...selectedPhotoIds]
        .forEach(
            id => {

                if (!validIds.has(id)) {

                    selectedPhotoIds.delete(
                        id
                    );
                }
            }
        );


        renderPhotos();

        updateSelectionCount();


        status.className =
            "success";

        status.textContent =
            currentPhotos.length
            +
            "枚の写真を表示中";

    }
    catch (error) {

        console.error(error);

        status.className =
            "error";

        status.textContent =
            "写真を読み込めませんでした。";
    }
}


/* ========================================
   写真表示
======================================== */

function renderPhotos() {

    photoGrid.innerHTML =
        "";


    currentPhotos.forEach(
        photo => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "photo-card";


            if (photo.award) {

                card.classList.add(
                    "award-selected"
                );
            }


            if (
                selectedPhotoIds.has(
                    photo.id
                )
            ) {

                card.classList.add(
                    "download-selected"
                );
            }


            const checkbox =
                document.createElement(
                    "input"
                );

            checkbox.type =
                "checkbox";

            checkbox.className =
                "photo-checkbox";

            checkbox.checked =
                selectedPhotoIds.has(
                    photo.id
                );


            checkbox.addEventListener(
                "change",
                () => {

                    if (checkbox.checked) {

                        selectedPhotoIds.add(
                            photo.id
                        );

                        card.classList.add(
                            "download-selected"
                        );

                    } else {

                        selectedPhotoIds.delete(
                            photo.id
                        );

                        card.classList.remove(
                            "download-selected"
                        );
                    }

                    updateSelectionCount();
                }
            );


            card.appendChild(
                checkbox
            );


            const imageWrapper =
                document.createElement(
                    "div"
                );

            imageWrapper.className =
                "image-wrapper";


            const img =
                document.createElement(
                    "img"
                );


            const imageError =
                document.createElement(
                    "div"
                );

            imageError.className =
                "image-error";

            imageError.innerHTML =
                "この画像を<br>読み込めません";


            img.onload =
                () => {

                    img.style.display =
                        "block";

                    imageError.style.display =
                        "none";
                };


            img.onerror =
                () => {

                    img.style.display =
                        "none";

                    imageError.style.display =
                        "flex";
                };


            img.src =
                photo.image_url;


            imageWrapper.appendChild(
                img
            );

            imageWrapper.appendChild(
                imageError
            );


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "photo-info";


            const nickname =
                document.createElement(
                    "div"
                );

            nickname.className =
                "nickname";

            nickname.textContent =
                photo.nickname
                ||
                "ニックネームなし";

            info.appendChild(
                nickname
            );


            if (photo.award) {

                const badge =
                    document.createElement(
                        "div"
                    );

                badge.className =
                    "award-badge";

                badge.textContent =
                    "🏆 "
                    +
                    photo.award;

                info.appendChild(
                    badge
                );
            }


            const selectButton =
                document.createElement(
                    "button"
                );

            selectButton.className =
                "select-button";

            selectButton.textContent =
                photo.award
                ?
                "賞を変更する"
                :
                "この写真を選ぶ";


            selectButton.addEventListener(
                "click",
                () => {

                    setAward(
                        photo.id,
                        awardSelect.value
                    );
                }
            );


            info.appendChild(
                selectButton
            );


            if (photo.award) {

                const announceButton =
                    document.createElement(
                        "button"
                    );

                announceButton.className =
                    "announce-button";

                announceButton.textContent =
                    "🎉 会場で発表する";


                announceButton.addEventListener(
                    "click",
                    () => {

                        announcePhoto(
                            photo.id,
                            photo.award,
                            photo.nickname
                        );
                    }
                );


                info.appendChild(
                    announceButton
                );


                const clearButton =
                    document.createElement(
                        "button"
                    );

                clearButton.className =
                    "clear-button";

                clearButton.textContent =
                    "賞の選択を解除";


                clearButton.addEventListener(
                    "click",
                    () => {

                        setAward(
                            photo.id,
                            ""
                        );
                    }
                );


                info.appendChild(
                    clearButton
                );
            }


            const singleDownloadButton =
                document.createElement(
                    "button"
                );

            singleDownloadButton.className =
                "single-download-button";

            singleDownloadButton.textContent =
                "📥 この写真をDL";


            singleDownloadButton.addEventListener(
                "click",
                () => {

                    downloadSinglePhoto(
                        photo
                    );
                }
            );


            info.appendChild(
                singleDownloadButton
            );


            const singleDeleteButton =
                document.createElement(
                    "button"
                );

            singleDeleteButton.className =
                "single-delete-button";

            singleDeleteButton.textContent =
                "🗑 この写真を削除";


            singleDeleteButton.addEventListener(
                "click",
                () => {

                    deleteSinglePhoto(
                        photo
                    );
                }
            );


            info.appendChild(
                singleDeleteButton
            );


            card.appendChild(
                imageWrapper
            );

            card.appendChild(
                info
            );

            photoGrid.appendChild(
                card
            );
        }
    );
}


/* ========================================
   選択数
======================================== */

function updateSelectionCount() {

    selectionCount.textContent =
        selectedPhotoIds.size
        +
        "枚選択中";


downloadSelectedButton.disabled =
    selectedPhotoIds.size === 0;

shareSelectedButton.disabled =
    selectedPhotoIds.size === 0;

deleteSelectedButton.disabled =
    selectedPhotoIds.size === 0;
}


/* ========================================
   全選択
======================================== */

selectAllButton.addEventListener(
    "click",
    () => {

        currentPhotos.forEach(
            photo => {

                selectedPhotoIds.add(
                    photo.id
                );
            }
        );

        renderPhotos();

        updateSelectionCount();
    }
);


/* ========================================
   選択解除
======================================== */

unselectAllButton.addEventListener(
    "click",
    () => {

        selectedPhotoIds.clear();

        renderPhotos();

        updateSelectionCount();
    }
);


/* ========================================
   Storageパス
======================================== */

function getStoragePath(
    imageUrl
) {

    try {

        const marker =
            "/storage/v1/object/public/"
            +
            STORAGE_BUCKET
            +
            "/";


        const index =
            imageUrl.indexOf(
                marker
            );


        if (index === -1) {

            return null;
        }


        return decodeURIComponent(
            imageUrl.substring(
                index
                +
                marker.length
            )
        );

    }
    catch (error) {

        console.error(error);

        return null;
    }
}


/* ========================================
   ファイル名
======================================== */

function makeFileName(
    photo,
    index = 1
) {

    const nickname =
        (
            photo.nickname
            ||
            "guest"
        )
        .replace(
            /[\\/:*?"<>|]/g,
            "_"
        );


    return (
        String(index)
        .padStart(
            3,
            "0"
        )
        +
        "_"
        +
        nickname
        +
        ".jpg"
    );
}


/* ========================================
   1枚ダウンロード
======================================== */

async function downloadSinglePhoto(
    photo
) {

    status.className =
        "loading";

    status.textContent =
        "写真を準備しています…";


    try {

        const response =
            await fetch(
                photo.image_url
            );


        if (!response.ok) {

            throw new Error(
                "画像取得失敗"
            );
        }


        const blob =
            await response.blob();


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );

        a.href =
            url;

        a.download =
            makeFileName(
                photo
            );


        document.body.appendChild(
            a
        );

        a.click();

        a.remove();


        setTimeout(
            () => {
                URL.revokeObjectURL(
                    url
                );
            },
            2000
        );


        status.className =
            "success";

        status.textContent =
            "写真をダウンロードしました。";

    }
    catch (error) {

        console.error(error);

        status.className =
            "error";

        status.textContent =
            "写真をダウンロードできませんでした。";
    }
}


/* ========================================
   ZIPダウンロード
======================================== */

downloadSelectedButton.addEventListener(
    "click",
    downloadSelectedPhotos
);


async function downloadSelectedPhotos() {

    const photos =
        currentPhotos.filter(
            photo =>
                selectedPhotoIds.has(
                    photo.id
                )
        );


    if (photos.length === 0) {
        return;
    }


    if (photos.length > 80) {

        const proceed =
            confirm(
                photos.length
                +
                "枚選択されています。\n\n"
                +
                "スマホでは一度に大量の写真をZIP化すると"
                +
                "重くなる場合があります。\n\n"
                +
                "このまま続けますか？"
            );

        if (!proceed) {
            return;
        }
    }


    status.className =
        "loading";

    status.textContent =
        "ZIPを作成しています…";

    downloadSelectedButton.disabled =
        true;


    try {

        const zip =
            new JSZip();


        for (
            let i = 0;
            i < photos.length;
            i++
        ) {

            const photo =
                photos[i];


            status.textContent =
                "写真を取得中 "
                +
                (i + 1)
                +
                " / "
                +
                photos.length;


            const response =
                await fetch(
                    photo.image_url
                );


            if (!response.ok) {

                throw new Error(
                    "画像取得失敗"
                );
            }


            const blob =
                await response.blob();


            zip.file(
                makeFileName(
                    photo,
                    i + 1
                ),
                blob
            );
        }


        status.textContent =
            "ZIPファイルを作成中…";


        const zipBlob =
            await zip.generateAsync(
                {
                    type:
                        "blob",

                    compression:
                        "DEFLATE",

                    compressionOptions: {
                        level: 4
                    }
                }
            );


        const url =
            URL.createObjectURL(
                zipBlob
            );


        const a =
            document.createElement(
                "a"
            );


        const dateText =
            new Date()
            .toISOString()
            .slice(
                0,
                10
            );


        a.href =
            url;

        a.download =
            "wedding_photos_"
            +
            dateText
            +
            ".zip";


        document.body.appendChild(
            a
        );

        a.click();

        a.remove();


        setTimeout(
            () => {
                URL.revokeObjectURL(
                    url
                );
            },
            5000
        );


        status.className =
            "success";

        status.textContent =
            photos.length
            +
            "枚をZIPでダウンロードしました。";

    }
    catch (error) {

        console.error(error);

        status.className =
            "error";

        status.textContent =
            "ZIPを作成できませんでした。";
    }


    updateSelectionCount();
}


/* ========================================
   Storage削除
======================================== */

async function deleteStorageFile(
    photo
) {

    const storagePath =
        getStoragePath(
            photo.image_url
        );


    if (!storagePath) {

        throw new Error(
            "Storageファイル名を取得できません"
        );
    }


    const encodedPath =
        storagePath
        .split("/")
        .map(
            part =>
                encodeURIComponent(
                    part
                )
        )
        .join("/");


    const response =
        await fetch(

            SUPABASE_URL
            +
            "/storage/v1/object/"
            +
            STORAGE_BUCKET
            +
            "/"
            +
            encodedPath,

            {
                method:
                    "DELETE",

                headers: {

                    "apikey":
                        SUPABASE_ANON_KEY,

                    "Authorization":
                        "Bearer "
                        +
                        SUPABASE_ANON_KEY
                }
            }
        );


    if (!response.ok) {

        throw new Error(
            await response.text()
        );
    }
}

/* ========================================

    );
}

/* =========================================
   選択写真をシェア（最大10枚）
========================================= */

shareSelectedButton.addEventListener(
    "click",
    shareSelectedPhotos
);

async function shareSelectedPhotos() {

    const photos = currentPhotos.filter(
        photo => selectedPhotoIds.has(photo.id)
    );

    if (photos.length === 0) {
        alert("シェアする写真を選択してください。");
        return;
    }

    if (photos.length > 10) {
        alert("シェアできる写真は一度に10枚までです。");
        return;
    }

    if (!navigator.share) {
        alert("この端末・ブラウザでは共有機能を利用できません。");
        return;
    }

    try {

        status.className = "";
        status.textContent =
            "シェア用の写真を準備しています…";

        const files = [];

        for (let i = 0; i < photos.length; i++) {

            const photo = photos[i];

            const response = await fetch(photo.image_url);

            if (!response.ok) {
                throw new Error("画像の取得に失敗しました");
            }

            const blob = await response.blob();

            let extension = "jpg";

            if (blob.type.includes("png")) {
                extension = "png";
            } else if (blob.type.includes("webp")) {
                extension = "webp";
            } else if (blob.type.includes("gif")) {
                extension = "gif";
            }

            const file = new File(
                [blob],
                `memory-flow-${i + 1}.${extension}`,
                {
                    type: blob.type || "image/jpeg"
                }
            );

            files.push(file);
        }

        const shareData = {
            files: files
        };

        if (
            navigator.canShare &&
            !navigator.canShare(shareData)
        ) {
            alert(
                "この端末では選択した写真をまとめて共有できません。"
            );

            status.textContent = "";
            return;
        }

        await navigator.share(shareData);

        status.className = "success";
        status.textContent =
            `${files.length}枚の写真を共有しました。`;

    } catch (error) {

        /*
           共有画面を自分で閉じた場合は
           エラー表示しない
        */
        if (error.name === "AbortError") {
            status.textContent = "";
            return;
        }

        console.error(
            "写真シェアエラー:",
            error
        );

status.className = "error";
status.textContent =
    "共有エラー：" + error.name + " / " + error.message;
    }
}
deleteSelectedButton.addEventListener(

async function deleteSelectedPhotos() {

    const photos =
        currentPhotos.filter(
            photo =>
                selectedPhotoIds.has(
                    photo.id
                )
        );


    if (photos.length === 0) {
        return;
    }


    const confirmed =
        confirm(
            photos.length
            +
            "枚の写真を完全に削除しますか？\n\n"
            +
            "元に戻すことはできません。"
        );


    if (!confirmed) {
        return;
    }


    const confirmedAgain =
        confirm(
            "最終確認です。\n\n"
            +
            photos.length
            +
            "枚を本当に削除しますか？"
        );


    if (!confirmedAgain) {
        return;
    }


    status.className =
        "loading";

    deleteSelectedButton.disabled =
        true;


    try {

        for (
            let i = 0;
            i < photos.length;
            i++
        ) {

            status.textContent =
                "削除中 "
                +
                (i + 1)
                +
                " / "
                +
                photos.length;


            await permanentlyDeletePhoto(
                photos[i]
            );
        }


        selectedPhotoIds.clear();

        await loadPhotos();


        status.className =
            "success";

        status.textContent =
            photos.length
            +
            "枚の写真を削除しました。";

    }
    catch (error) {

        console.error(error);

        status.className =
            "error";

        status.textContent =
            "途中で削除に失敗しました。写真一覧を更新してください。";
    }


    updateSelectionCount();
}

async function setAward(
    photoId,
    award
) {

    const label =
        award
        ||
        "選択解除";


    const confirmed =
        confirm(
            label
            +
            " にしますか？"
        );


    if (!confirmed) {
        return;
    }


    status.className =
        "loading";

    status.textContent =
        "保存しています…";


    try {

        const response =
            await fetch(

                SUPABASE_URL
                +
                "/rest/v1/rpc/set_photo_award",

                {
                    method:
                        "POST",

                    headers: {

                        "apikey":
                            SUPABASE_ANON_KEY,

                        "Authorization":
                            "Bearer "
                            +
                            SUPABASE_ANON_KEY,

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            {
                                p_photo_id:
                                    photoId,

                                p_award:
                                    award,

                                p_code:
                                    JUDGE_CODE
                            }
                        )
                }
            );


        if (!response.ok) {

            throw new Error(
                await response.text()
            );
        }


        await loadPhotos();


        status.className =
            "success";

        status.textContent =
            award
            ?
            "受賞写真を保存しました。"
            :
            "賞の選択を解除しました。";

    }
    catch (error) {

        console.error(error);

        status.className =
            "error";

        status.textContent =
            "保存できませんでした。";
    }
}
